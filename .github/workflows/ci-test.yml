name: CI Test

on:
  push:
    branches:
      - 'test/common-workflows'
  pull_request:

permissions: {}

jobs:
  build:
    name: CI Test Build OS ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.head.repo.fork == false
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
#      - name: Checkout, set up JDK 21, build with Maven and Run SonarCloud analysis
#        uses: powsybl/github-ci/setup-java-maven-sonar@ad525ed0fe9a287baf5eea5c569d8c95f0266e79
#        with:
#          sonar_token: ${{ secrets.SONAR_TOKEN }}
#          sonar_projectKey: 'com.powsybl:powsybl-core'

      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven ( Ubuntu )
        if: matrix.os == 'ubuntu-latest'
        run: ./mvnw -B -ntp -Pjacoco install

      - name: Build with Maven ( != Ubuntu )
        if: matrix.os != 'ubuntu-latest'
        run: ./mvnw -B -ntp verify