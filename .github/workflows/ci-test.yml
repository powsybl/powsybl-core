name: CI Test

on:
  push:
    branches:
      - 'test/common-workflows'
  pull_request:

permissions: {}

jobs:
  build:
    name: CI Test Build OS ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event.pull_request.head.repo.fork == false
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout, set up JDK 21 And Build with Maven
        uses: powsybl/github-ci/setup-java-maven@75282a89476ecef2a57878fcbd55d76daed4ad70
